name: carehub_plus
description: "CareHub Plus — Cuidar com leveza, juntos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.3
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icone_app.png"
  name: "Carehub+"

flutter_native_splash:
  color: "#EFE8FC"
  image: assets/images/splash_transparente.png
  android_12:
    color: "#EFE8FC"
    image: assets/images/splash_transparente.png
  ios: true
