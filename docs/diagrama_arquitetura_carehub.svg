<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #F8F6FF; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Definição dos Gradientes da Identidade Visual CareHub+ -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="9%" stop-color="#7B61C8" />
      <stop offset="57%" stop-color="#A78BDB" />
      <stop offset="100%" stop-color="#E8AECE" />
    </linearGradient>

    <linearGradient id="primaryCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61C8" />
      <stop offset="100%" stop-color="#5A44A8" />
    </linearGradient>

    <linearGradient id="hubCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AF9EE0" />
      <stop offset="100%" stop-color="#7B61C8" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0ECFD" />
    </linearGradient>

    <!-- Sombras Finas (Design System shadow-sm) -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7B61C8" flood-opacity="0.12" />
    </filter>

    <filter id="hubShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7B61C8" flood-opacity="0.22" />
    </filter>

    <!-- Estilo das Setas -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7B61C8" />
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D946EF" />
    </marker>
  </defs>

  <!-- Fundo com Gradiente Suave -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Cabeçalho do Diagrama / Slide -->
  <rect x="0" y="0" width="1200" height="90" fill="url(#headerGrad)" />
  <text x="50" y="42" fill="#FFFFFF" font-size="26" font-weight="700" letter-spacing="0.5">CareHub+ | STARTUP-ONE HUB</text>
  <text x="50" y="68" fill="#F0ECFD" font-size="15" font-weight="500">Arquitetura de Solução &amp; IA HUB de Convergência de Interfaces Conversacionais — Enterprise Challenge 2026 (Claro)</text>

  <!-- CAMADA 1: INTERFACES CONVERSACIONAIS -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="1100" height="120" rx="16" fill="#FFFFFF" stroke="#D4CEEF" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="10" height="120" rx="4" fill="#7B61C8" />
    <text x="24" y="32" fill="#7B61C8" font-size="14" font-weight="700" letter-spacing="1">1. TOUCHPOINTS &amp; INTERFACES CONVERSACIONAIS (MULTICANAL)</text>
    
    <!-- Item 1: App CareHub+ -->
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="320" height="54" rx="10" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <circle cx="28" cy="27" r="16" fill="#7B61C8" />
      <text x="28" y="32" fill="#FFF" font-size="16" text-anchor="middle">📱</text>
      <text x="56" y="24" fill="#1A1A2E" font-size="14" font-weight="700">App Móvel CareHub+</text>
      <text x="56" y="40" fill="#6B6B8A" font-size="11" font-weight="500">Flutter (iOS/Android) — Assistente Cora AI</text>
    </g>

    <!-- Item 2: WhatsApp Business -->
    <g transform="translate(390, 48)">
      <rect x="0" y="0" width="320" height="54" rx="10" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <circle cx="28" cy="27" r="16" fill="#25D366" />
      <text x="28" y="32" fill="#FFF" font-size="16" text-anchor="middle">💬</text>
      <text x="56" y="24" fill="#1A1A2E" font-size="14" font-weight="700">WhatsApp Business API</text>
      <text x="56" y="40" fill="#6B6B8A" font-size="11" font-weight="500">Integração Externa Omnichannel</text>
    </g>

    <!-- Item 3: Voz / Assistants -->
    <g transform="translate(750, 48)">
      <rect x="0" y="0" width="320" height="54" rx="10" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <circle cx="28" cy="27" r="16" fill="#006494" />
      <text x="28" y="32" fill="#FFF" font-size="16" text-anchor="middle">🎙️</text>
      <text x="56" y="24" fill="#1A1A2E" font-size="14" font-weight="700">Interfaces de Voz / Smart</text>
      <text x="56" y="40" fill="#6B6B8A" font-size="11" font-weight="500">Google Asst / Alexa / Canais Claro</text>
    </g>
  </g>

  <!-- SETAS DE CONEXÃO 1 -> 2 -->
  <line x1="240" y1="240" x2="240" y2="280" stroke="#7B61C8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <line x1="600" y1="240" x2="600" y2="280" stroke="#7B61C8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <line x1="960" y1="240" x2="960" y2="280" stroke="#7B61C8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- CAMADA 2: IA HUB (DESTAQUE CENTRAL) -->
  <g transform="translate(50, 285)">
    <rect x="0" y="0" width="1100" height="170" rx="16" fill="#F0ECFD" stroke="#7B61C8" stroke-width="2" filter="url(#hubShadow)" />
    <rect x="0" y="0" width="12" height="170" rx="4" fill="url(#primaryCardGrad)" />
    <text x="28" y="32" fill="#5A44A8" font-size="15" font-weight="800" letter-spacing="1">2. CAMADA IA HUB — ORQUESTRADOR DE CONVERGÊNCIA CONVERSACIONAL</text>
    <rect x="680" y="14" width="390" height="24" rx="12" fill="#7B61C8" />
    <text x="875" y="30" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">✨ NÚCLEO DE INOVAÇÃO (PARCERIA CLARO)</text>

    <!-- Sub-modulo 1: Router -->
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#AF9EE0" stroke-width="1.5" />
      <text x="20" y="30" fill="#7B61C8" font-size="14" font-weight="700">🔀 Omnichannel Router</text>
      <text x="20" y="52" fill="#6B6B8A" font-size="12">Normalização de Payload HTTP/WS</text>
      <text x="20" y="70" fill="#6B6B8A" font-size="12">Roteamento Inteligente de Canais</text>
      <rect x="20" y="78" width="140" height="16" rx="4" fill="#F0ECFD" />
      <text x="25" y="90" fill="#7B61C8" font-size="10" font-weight="600">Protocol Abstraction</text>
    </g>

    <!-- Sub-modulo 2: Context Token Manager -->
    <g transform="translate(390, 48)">
      <rect x="0" y="0" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#7B61C8" stroke-width="2" />
      <text x="20" y="30" fill="#7B61C8" font-size="14" font-weight="700">🔑 Context Token Manager</text>
      <text x="20" y="52" fill="#1A1A2E" font-size="12" font-weight="600">Gerenciador de Estado do Cuidador</text>
      <text x="20" y="70" fill="#6B6B8A" font-size="12">Sincronização de Histórico (App ↔ Wpp)</text>
      <rect x="20" y="78" width="180" height="16" rx="4" fill="#E8AECE" />
      <text x="25" y="90" fill="#FFFFFF" font-size="10" font-weight="700">Cross-Platform State Sync</text>
    </g>

    <!-- Sub-modulo 3: Motor NLU/LLM Cora AI -->
    <g transform="translate(750, 48)">
      <rect x="0" y="0" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#AF9EE0" stroke-width="1.5" />
      <text x="20" y="30" fill="#7B61C8" font-size="14" font-weight="700">🧠 NLU / LLM &amp; Health RAG</text>
      <text x="20" y="52" fill="#6B6B8A" font-size="12">Assistente Cora AI &amp; Concierge Toke</text>
      <text x="20" y="70" fill="#6B6B8A" font-size="12">Intenções (Medicação, Rotina, SOS)</text>
      <rect x="20" y="78" width="160" height="16" rx="4" fill="#F0ECFD" />
      <text x="25" y="90" fill="#7B61C8" font-size="10" font-weight="600">AI Predictive Safeguard</text>
    </g>
  </g>

  <!-- SETAS DE CONEXÃO 2 -> 3 -->
  <line x1="600" y1="455" x2="600" y2="495" stroke="#7B61C8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- CAMADA 3: BACKEND & SERVIÇOS CORE -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="1100" height="120" rx="16" fill="#FFFFFF" stroke="#D4CEEF" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="10" height="120" rx="4" fill="#5A44A8" />
    <text x="24" y="32" fill="#5A44A8" font-size="14" font-weight="700" letter-spacing="1">3. BACKEND &amp; INFRAESTRUTURA DE DADOS (FIREBASE &amp; NODE.JS)</text>

    <!-- Item 1: Firebase Auth -->
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="320" height="54" rx="10" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <circle cx="28" cy="27" r="16" fill="#FFCA28" />
      <text x="28" y="32" fill="#FFF" font-size="14" text-anchor="middle">🔐</text>
      <text x="56" y="24" fill="#1A1A2E" font-size="14" font-weight="700">Firebase Auth</text>
      <text x="56" y="40" fill="#6B6B8A" font-size="11" font-weight="500">Sessões Cuidadores &amp; JWT Tokens</text>
    </g>

    <!-- Item 2: Node.js REST API -->
    <g transform="translate(390, 48)">
      <rect x="0" y="0" width="320" height="54" rx="10" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <circle cx="28" cy="27" r="16" fill="#68A063" />
      <text x="28" y="32" fill="#FFF" font-size="14" text-anchor="middle">⚙️</text>
      <text x="56" y="24" fill="#1A1A2E" font-size="14" font-weight="700">Node.js / Express API</text>
      <text x="56" y="40" fill="#6B6B8A" font-size="11" font-weight="500">Orquestração &amp; Regras de Negócio</text>
    </g>

    <!-- Item 3: Cloud Firestore -->
    <g transform="translate(750, 48)">
      <rect x="0" y="0" width="320" height="54" rx="10" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <circle cx="28" cy="27" r="16" fill="#FF6F00" />
      <text x="28" y="32" fill="#FFF" font-size="14" text-anchor="middle">🗄️</text>
      <text x="56" y="24" fill="#1A1A2E" font-size="14" font-weight="700">Cloud Firestore</text>
      <text x="56" y="40" fill="#6B6B8A" font-size="11" font-weight="500">Cuidador / Cuidado (Vovó Lúcia, Yuna)</text>
    </g>
  </g>

  <!-- SETAS DE CONEXÃO 3 -> 4 -->
  <line x1="210" y1="620" x2="210" y2="655" stroke="#7B61C8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <line x1="600" y1="620" x2="600" y2="655" stroke="#D946EF" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowPink)" />
  <line x1="960" y1="620" x2="960" y2="655" stroke="#7B61C8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- CAMADA 4: INTEGRAÇÕES & EVENTOS -->
  <g transform="translate(50, 660)">
    <rect x="0" y="0" width="1100" height="100" rx="16" fill="#FFFFFF" stroke="#D4CEEF" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="10" height="100" rx="4" fill="#1A1A2E" />
    <text x="24" y="28" fill="#1A1A2E" font-size="14" font-weight="700" letter-spacing="1">4. DISPAROS, NOTIFICAÇÕES &amp; RECURSOS DE SALVAGUARDA</text>

    <!-- Item 1: FCM Push -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="320" height="46" rx="8" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <text x="16" y="28" fill="#1A1A2E" font-size="13" font-weight="700">🔔 FCM Push Notifications</text>
    </g>

    <!-- Item 2: SOS Emergency -->
    <g transform="translate(390, 40)">
      <rect x="0" y="0" width="320" height="46" rx="8" fill="#FDF2F8" stroke="#F472B6" stroke-width="1.5" />
      <text x="16" y="28" fill="#9D174D" font-size="13" font-weight="700">🚨 Disparo de Alertas SOS (Rede de Apoio)</text>
    </g>

    <!-- Item 3: APIs Claro / Telemetria -->
    <g transform="translate(750, 40)">
      <rect x="0" y="0" width="320" height="46" rx="8" fill="#F8F6FF" stroke="#D4CEEF" stroke-width="1" />
      <text x="16" y="28" fill="#1A1A2E" font-size="13" font-weight="700">📡 APIs de Conectividade / Claro</text>
    </g>
  </g>
</svg>
